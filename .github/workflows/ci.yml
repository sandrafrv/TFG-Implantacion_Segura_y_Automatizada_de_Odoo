name: CI Validator  # Nombre del Workflow que aparece en la pestaña "Actions" de GitHub

# ============================================================
# GITHUB ACTION: CI Validator
# DESCRIPCIÓN: Valida la sintaxis de los archivos clave del
#              proyecto automáticamente en cada push o Pull Request.
#              Si hay un error de sintaxis, GitHub lo notifica
#              y bloquea la integración del código defectuoso.
# ============================================================

# --- DISPARADORES (Cuándo se activa este Workflow) ---
on:
  push:
    branches: [ "main" ]  # Se ejecuta cuando se hace 'git push' a la rama principal
  pull_request:
    branches: [ "main" ]  # También se ejecuta al abrir un Pull Request hacia main

# --- JOBS (Las tareas que ejecutará GitHub en la nube) ---
jobs:

  validate:
    name: Syntax & Code Validation  # Nombre descriptivo que aparece en la UI de GitHub
    runs-on: ubuntu-latest          # GitHub levanta una VM Ubuntu limpia para ejecutar los pasos

    # --- STEPS (Pasos secuenciales dentro del job) ---
    steps:

      # PASO 1: Descargar el código del repositorio en la VM de GitHub
      - name: Descargar el código
        uses: actions/checkout@v4  # Acción oficial de GitHub para clonar el repo

      # PASO 2: Validar la sintaxis YAML del docker-compose instalando yamllint
      - name: Validar Sintaxis YAML de Docker
        run: |
          sudo apt-get install -y yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" docker/docker-compose.yml
        continue-on-error: true  # Si falla, no detiene el pipeline completo (avisará pero seguirá)

      # PASO 3: Validación estructural del Docker Compose (más fiable que el linter YAML)
      - name: Validar Docker Compose estructuralmente
        run: |
          # docker-compose config -q valida que el yml es sintácticamente correcto
          # y que todos los servicios, volúmenes y redes están bien definidos.
          # Si hay un error de indentación o una clave desconocida, este comando falla.
          docker-compose -f docker/docker-compose.yml config -q

      # PASO 4 y 5: Análisis estático de los Scripts Bash con ShellCheck
      - name: Instalar ShellCheck
        # ShellCheck es el analizador de código Bash más usado en el mundo profesional.
        # Detecta variables no entrecomilladas, bucles mal escritos, subcomandos ineficientes, etc.
        run: sudo apt-get install -y shellcheck

      - name: Validar Scripts con ShellCheck
        run: |
          echo "Analizando todos los scripts de la carpeta scripts/..."
          # shellcheck analiza cada archivo .sh y reporta los avisos y errores encontrados.
          # Si detecta un error real (no solo advertencia), el comando fallará
          # y GitHub marcará el commit como ROJO (fallido).
          shellcheck scripts/*.sh

      # PASO 6: Validación del Markdown de la documentación
      - name: Validar Markdown (Limpieza de sintaxis)
        uses: DavidAnson/markdownlint-cli2-action@v16  # Acción que ejecuta markdownlint
        with:
          globs: "**/*.md"     # Valida TODOS los archivos markdown del repositorio
        continue-on-error: true  # Fallos de estilo en docs no rompen el pipeline principal
