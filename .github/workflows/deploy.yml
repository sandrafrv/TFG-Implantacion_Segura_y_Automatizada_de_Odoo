name: CD Deploy (Self-Hosted)  # Nombre del Workflow visible en la pestaña "Actions" de GitHub

# ============================================================
# GITHUB ACTION: CD Deploy
# DESCRIPCIÓN: Descarga las imágenes Docker más recientes y
#              despliega el stack Odoo+PostgreSQL+Nginx en el
#              servidor Debian de la DMZ de forma automática.
#
# PRE-REQUISITO: El servidor Debian debe estar registrado como
#                self-hosted runner en este repositorio.
#                Ver: scripts/setup_runner.sh
# ============================================================

# --- DISPARADORES ---
on:
  # Solo se activa cuando el workflow de CI pasa correctamente en main.
  # Esto garantiza que nunca se desplegará código que no haya pasado la validación.
  workflow_run:
    workflows: ["CI Validator"]   # Debe coincidir exactamente con el "name:" de ci.yml
    types:
      - completed                 # Se dispara cuando el CI termina (sea éxito o fallo)
    branches:
      - main                      # Solo en la rama principal

# --- JOBS ---
jobs:

  deploy:
    name: Desplegar Stack en Servidor Debian
    # Este job SOLO se ejecuta si el CI anterior terminó con éxito.
    # Sin esta condición, se ejecutaría también cuando el CI falla.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # ⬇️ CLAVE: "self-hosted" indica que este job NO corre en las VMs de GitHub,
    # sino en el runner registrado manualmente en nuestro servidor Debian.
    runs-on: self-hosted

    # --- STEPS ---
    steps:

      # PASO 1: Verificación inicial del entorno en el servidor Debian
      - name: Verificar entorno del servidor
        run: |
          echo "============================================="
          echo " Iniciando despliegue automático"
          echo " Servidor: $(hostname)"
          echo " Fecha:    $(date '+%Y-%m-%d %H:%M:%S')"
          echo " Docker:   $(docker --version)"
          echo "============================================="

      # PASO 2: Descargar las imágenes Docker más recientes desde Docker Hub.
      # Esto garantiza que siempre corremos la versión más actualizada de cada imagen.
      - name: Descargar imágenes Docker (docker pull)
        run: |
          echo "[1/3] Descargando imagen de PostgreSQL 16..."
          docker pull postgres:16

          echo "[2/3] Descargando imagen de Odoo 17..."
          docker pull odoo:17

          echo "[3/3] Descargando imagen de Nginx Alpine..."
          docker pull nginx:alpine

          echo "Todas las imágenes están actualizadas."

      # PASO 3: Ejecutar el script de despliegue del proyecto.
      # Este script levanta el stack con docker compose y espera a que Odoo esté sano.
      - name: Ejecutar deploy.sh
        working-directory: /opt/erp-odoo   # Directorio raíz del proyecto en el servidor
        run: |
          echo "Ejecutando script de despliegue..."
          bash scripts/deploy.sh

      # PASO 4: Mostrar el estado final de los contenedores para confirmar éxito.
      - name: Verificar estado del stack
        working-directory: /opt/erp-odoo
        run: |
          echo "Estado final de los contenedores:"
          docker compose -f docker/docker-compose.yml ps
          echo ""
          echo "[OK] Despliegue completado con éxito."
