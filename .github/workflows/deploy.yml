name: CD Deploy (Self-Hosted)

# ============================================================
# GITHUB ACTION: CD Deploy
# DESCRIPCIÓN: Descarga las imágenes Docker más recientes y
#              despliega el stack Odoo+PostgreSQL+Nginx en el
#              servidor Debian de la DMZ de forma automática.
#
# PRE-REQUISITO: El servidor Debian debe estar registrado como
#                self-hosted runner en este repositorio.
#                Ver: scripts/setup_runner.sh
# ============================================================

on:
  workflow_run:
    workflows: ["CI Validator"]
    types:
      - completed
    branches:
      - main

jobs:

  deploy:
    name: Desplegar Stack en Servidor Debian
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:

      - name: Verificar entorno del servidor
        run: |
          echo "============================================="
          echo " Iniciando despliegue automático"
          echo " Servidor: $(hostname)"
          echo " Fecha:    $(date '+%Y-%m-%d %H:%M:%S')"
          echo " Docker:   $(docker --version)"
          echo "============================================="

      # PASO CLAVE: sincronizar el repositorio en el servidor antes de ejecutar
      # cualquier script. Garantiza que siempre se usa la versión más reciente
      # de los scripts del repo, no una copia antigua en /opt/erp-odoo.
      - name: Sincronizar repositorio en el servidor (git pull)
        working-directory: /opt/erp-odoo
        run: |
          echo "Sincronizando repositorio con origin/main..."
          git fetch origin
          git reset --hard origin/main
          echo "Repositorio actualizado al commit: $(git rev-parse --short HEAD)"

      - name: Descargar imágenes Docker (docker pull)
        run: |
          echo "[1/3] Descargando imagen de PostgreSQL 16..."
          docker pull postgres:16

          echo "[2/3] Descargando imagen de Odoo 17..."
          docker pull odoo:17

          echo "[3/3] Descargando imagen de Nginx Alpine..."
          docker pull nginx:alpine

          echo "Todas las imágenes están actualizadas."

      - name: Ejecutar deploy.sh
        working-directory: /opt/erp-odoo
        run: |
          echo "Ejecutando script de despliegue..."
          bash scripts/deploy.sh

      - name: Verificar estado del stack
        working-directory: /opt/erp-odoo
        run: |
          echo "Estado final de los contenedores:"
          docker compose -f docker/docker-compose.yml ps
          echo ""
          echo "[OK] Despliegue completado con éxito."
