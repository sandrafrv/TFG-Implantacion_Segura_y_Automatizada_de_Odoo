# ============================================================
# ARCHIVO: odoo_proxy.conf
# DESCRIPCIÓN: Configuración del Proxy Inverso Nginx para Odoo.
#              Este archivo se monta en el contenedor nginx-proxy
#              (en /etc/nginx/conf.d/) desde el volumen del host.
#              Nginx lo carga automáticamente al arrancar.
# ============================================================

# ---- BLOQUE 1: SERVIDOR HTTP (Puerto 80) ----
# Solo sirve para redirigir a los usuarios despistados que entran
# por http:// hacia https:// de forma automática y transparente.
server {
    listen 80;                          # Escucha peticiones en el puerto 80 (HTTP estándar)
    server_name erp.techsolutions.local; # Nombre de dominio que debe coincidir con el DNS de pfSense

    # Redirige PERMANENTEMENTE (código 301) al mismo host pero por HTTPS
    # $host contiene el nombre del dominio que pidió el usuario
    # $request_uri contiene la ruta completa de la URL (/login, /web, etc.)
    return 301 https://$host$request_uri;
}

# ---- BLOQUE 2: SERVIDOR HTTPS (Puerto 443) ----
# Aquí está la lógica principal. Nginx termina el cifrado SSL,
# descifra la petición y la pasa en claro al contenedor de Odoo.
server {
    listen 443 ssl;                      # Puerto 443 con SSL/TLS activado
    server_name erp.techsolutions.local; # Mismo dominio que el bloque HTTP

    # ---- CONFIGURACIÓN SSL/TLS ----

    # Ruta del certificado público dentro del contenedor.
    # Nginx lee el volumen montado desde ./certs del Host (Debian).
    ssl_certificate /etc/ssl/certs_local/odoo-selfsigned.crt;

    # Ruta de la clave privada del certificado (NUNCA debe ser pública)
    ssl_certificate_key /etc/ssl/certs_local/odoo-selfsigned.key;

    # Solo permite protocolos TLS modernos y seguros.
    # Desactiva TLS 1.0 y 1.1 (vulnerables a ataques como POODLE y BEAST)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Preferir los algoritmos de cifrado del servidor sobre los del cliente
    ssl_prefer_server_ciphers on;

    # Lista de algoritmos de cifrado permitidos (todos de alta seguridad)
    # !aNULL excluye cifrados sin autenticación
    # !MD5 excluye el hash MD5 (obsoleto y roto)
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ---- LOGS ----

    # Archivo donde Nginx guarda quién accedió a la web, cuándo y desde qué IP
    access_log /var/log/nginx/odoo_access.log;

    # Archivo donde Nginx guarda errores (conexiones fallidas, certificados malos, etc.)
    error_log /var/log/nginx/odoo_error.log;

    # ---- CABECERAS DE SEGURIDAD HTTP ----
    # Fuente técnica: investigacion.md — "Nginx ofuscará la topología interna"
    # Referencia: https://oec.sh/guides/odoo-nginx-config

    # HSTS: obliga al navegador a usar HTTPS durante 1 año incluso si el usuario
    # escribe "http://" manualmente. Evita ataques de downgrade.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Evita que la página de Odoo se muestre dentro de un iframe en otro dominio
    # (protección contra ataques de clickjacking)
    add_header X-Frame-Options SAMEORIGIN always;

    # Impide que el navegador interprete archivos con un tipo MIME diferente al declarado
    # (protección contra ataques de MIME-sniffing)
    add_header X-Content-Type-Options nosniff always;

    # Controla qué información de referencia se envía al hacer clic en enlaces externos
    # "strict-origin" solo envía el dominio (no la URL completa), protegiendo la privacidad
    add_header Referrer-Policy "strict-origin" always;

    # ---- AJUSTES DE CARGA ----

    # Tamaño máximo de los archivos que los usuarios pueden subir a Odoo
    # (facturas PDF, imágenes de productos, documentos adjuntos, etc.)
    # 100M = 100 Megabytes. Si se excede, Nginx devuelve error 413 (Request Too Large)
    client_max_body_size 100M;

    # ---- BLOQUE DE PROXY PASS (El núcleo de la configuración) ----
    # Todo el tráfico que llegue a "/" (cualquier URL) se reenvía a Odoo
    location / {

        # Dirección del contenedor de Odoo dentro de la red Docker interna.
        # "odoo-web" es el nombre del contenedor (resolución DNS interna de Docker)
        # 8069 es el puerto en el que Odoo escucha las peticiones HTTP
        proxy_pass http://odoo-web:8069;

        # Usar HTTP/1.1 para la conexión con Odoo (necesario para WebSockets)
        proxy_http_version 1.1;

        # Cabeceras para soporte de WebSockets (usadas por el chat en vivo y las notificaciones de Odoo)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pasa el nombre de dominio original al backend de Odoo
        # Así Odoo genera URLs correctas en los correos y redirecciones
        proxy_set_header Host $host;

        # Pasa la IP real del cliente al log de Odoo.
        # Sin esto, Odoo registraría la IP interna de Nginx (127.0.0.1) en todos los accesos
        proxy_set_header X-Real-IP $remote_addr;

        # Añade la IP del cliente a la cabecera estándar X-Forwarded-For
        # (Necesario para que Odoo informe correctamente de los accesos por usuario)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Informa a Odoo de que la conexión exterior es HTTPS aunque el proxy
        # hable con él internamente por HTTP
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tiempos de espera generosos para operaciones pesadas de Odoo
        # (generación de informes PDF, importaciones de datos, etc.)
        # 720 segundos = 12 minutos. Con el tiempo por defecto de 60s, los informes grandes fallaban.
        proxy_read_timeout 720s;    # Tiempo máximo esperando respuesta de Odoo
        proxy_connect_timeout 720s; # Tiempo máximo para establecer la conexión inicial
        proxy_send_timeout 720s;    # Tiempo máximo enviando datos al cliente
    }

    # ---- BLOQUE LONGPOLLING (WebSocket para LiveChat y Discuss de Odoo) ----
    # El módulo de chat en tiempo real de Odoo usa conexiones persistentes (longpolling)
    # en el puerto 8072. Sin este bloque, el chat y las notificaciones en tiempo real
    # no funcionan a través del proxy.
    # Fuente: investigacion.md — "gestionará los túneles WebSocket necesarios para
    #          el funcionamiento en tiempo real del ERP"
    location /longpolling/ {
        proxy_pass http://odoo-web:8072;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
