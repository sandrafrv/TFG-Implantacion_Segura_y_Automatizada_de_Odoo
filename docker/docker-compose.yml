# ====================================================================
# STACK DOCKER: ERP Odoo TFG ASIR
# DESCRIPCIÓN: Este archivo define los 4 servicios (contenedores) que
#              forman el sistema ERP:
#                1. odoo_erp    → PostgreSQL 16 (BD interna, sin IP pública)
#                2. odoo-web    → Odoo 17 CE    (MACVLAN 192.168.30.21)
#                3. nginx-proxy → Nginx Alpine  (MACVLAN 192.168.30.20)
#
# Control de acceso:
#   VLAN 10 (Usuarios)  → accede a Odoo vía nginx (.20)
#   VLAN 40 (Admin/DBA) → accede a gestión del servidor + panel BD
#   LDAP (.22)          → gestiona usuarios/grupos de VLAN 10
#
# USO: Ejecutar desde /opt/erp-odoo con:
#      docker compose -f docker/docker-compose.yml up -d
# ====================================================================

services:

  # ------------------------------------------------------------------
  # SERVICIO 1: Base de Datos PostgreSQL
  # Contenedor que aloja el motor de base de datos relacional.
  # Odoo intentará conectarse a él en el arranque.
  # ------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: odoo_erp
    restart: always

    environment:
      - POSTGRES_DB=odoo_erp
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - ../postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      odoo_net:

  # ------------------------------------------------------------------
  # SERVICIO 2: Aplicación Web Odoo
  # El ERP propiamente dicho. Se conecta al contenedor "db" para leer
  # y guardar datos, pero nunca está expuesto directamente a Internet.
  # ------------------------------------------------------------------
  odoo:
    image: odoo:17
    container_name: odoo-web
    restart: always

    depends_on:
      db:
        condition: service_healthy

    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}

    user: "101:101"

    volumes:
      - ../addons:/mnt/extra-addons
      - ../odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ../odoo_sessions:/tmp/odoo

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8069/web/health" ]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s

    networks:
      odoo_net:
      macvlan_vlan30:
        ipv4_address: 192.168.30.21

  # ------------------------------------------------------------------
  # SERVICIO 4: Proxy Inverso Nginx
  # Es la única puerta de entrada desde el exterior. Recibe las
  # peticiones HTTPS del usuario, las descifra y las reenvía a Odoo.
  # Es el ÚNICO contenedor que abre puertos al Host (Debian).
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always

    depends_on:
      - odoo

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ../config_nginx:/etc/nginx/conf.d
      - ../certs:/etc/ssl/certs_local

    healthcheck:
      test: [ "CMD-SHELL", "nginx -t" ]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      odoo_net:
      macvlan_vlan30:
        ipv4_address: 192.168.30.20

# ====================================================================
# REDES DOCKER
# Se define una red privada bridged interna llamada "odoo_net".
# Los 3 contenedores la comparten.
# Ventaja: se comunican por nombre (ej: http://odoo-web:8069) y están
# completamente aislados del resto de contenedores del servidor.
# ====================================================================
networks:
  odoo_net:
    driver: bridge
  macvlan_vlan30:
    external: true
